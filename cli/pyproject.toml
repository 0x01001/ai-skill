[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skill-jev"
version = "0.1.0"
description = "Optional Jev discovery for the ai-skill Claude Code skills: `ai auth`, `ai logout`, `ai doctor` and the `jg` shim."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Pinned: the secret store backend is part of the security boundary (plan 6.1).
dependencies = ["keyring==25.7.0"]

[project.scripts]
ai = "ai_skill_jev.cli:main"
jg = "ai_skill_jev.jg_shim:main"

[tool.setuptools.packages.find]
where = ["src"]
